<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anmelden – 1A Motor | Einloggen</title>
<meta name="description" content="Bei 1A Motor anmelden – Nachrichten, Angebote und Inserate an einem Ort." />
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="apple-touch-icon" href="/favicon-192x192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="preload" as="image" href="/kettensaege.webp" />
<link rel="stylesheet" href="/mobile.css" />
<style>
  :root {
    --ink: #0f1b2b; --ink2: #2b3a4f; --muted: #6b7d93; --line: #d6dee8;
    --bg: #f4f7fb; --blue: #2f62a8; --blue-h: #27548f; --sky: #5aa0f2;
    --navy: #1b2a3f; --navy2: #111b2b; --soft: #e9f0f9;
    --ok: #16a34a; --err: #dc2626; --r: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body { font-family: 'Outfit', Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }

  .auth { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }

  /* ── Linke Seite: Foto + Text ── */
  .side { position: relative; overflow: hidden; color: #fff; background: #111; display: flex; flex-direction: column; justify-content: flex-end; padding: 64px clamp(32px, 7vw, 100px) clamp(48px, 9vh, 96px); }
  /* Kettensäge als Vollbild, dunkler Verlauf von unten nach oben */
  .side-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 72% 50%; }
  .side::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.72) 28%, rgba(0,0,0,.32) 52%, rgba(0,0,0,0) 72%),
      linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 18%); }
  .side > *:not(.side-photo) { position: relative; z-index: 1; }
  .side-logo { position: absolute !important; top: 32px; left: clamp(32px, 7vw, 100px); display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.01em; color: #fff; }
  .side-logo b { background: var(--blue); border-radius: 8px; padding: 3px 8px; font-size: 16px; }
  .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--sky); margin-bottom: 22px; }
  .side h2 { font-size: clamp(32px, 3.4vw, 44px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin-bottom: 30px; }
  .checks { list-style: none; display: grid; gap: 16px; }
  .checks li { display: flex; align-items: center; gap: 14px; font-size: 17px; color: #dbe4ef; }
  .checks svg { flex: none; width: 20px; height: 20px; stroke: var(--sky); }

  /* ── Rechte Seite: Formular ── */
  .main { display: flex; align-items: center; justify-content: center; padding: 56px 24px; }
  .box { width: 100%; max-width: 440px; }
  .box h1 { font-size: 34px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 22px; }

  .social { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .social.one { grid-template-columns: 1fr; }
  .btn-social { display: flex; align-items: center; justify-content: center; gap: 10px; height: 48px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); font-weight: 700; font-size: 16px; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
  .btn-social:hover { border-color: #b9c6d6; box-shadow: 0 2px 10px rgba(15,27,43,.06); }
  .btn-social svg { width: 20px; height: 20px; }
  .btn-social[hidden] { display: none; }

  .divider { display: flex; align-items: center; gap: 14px; margin: 22px 0 18px; color: var(--muted); font-size: 15px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e1e7ef; }

  .seg-label { font-size: 14px; font-weight: 700; color: var(--ink2); margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); }
  .seg button { height: 40px; border: 0; border-radius: 9px; background: transparent; font-weight: 700; font-size: 15px; color: var(--muted); transition: background .15s, color .15s; }
  .seg button.active { background: var(--navy); color: #fff; }
  .seg-hint { font-size: 13.5px; color: var(--muted); margin: 8px 2px 4px; min-height: 19px; }

  .field { margin-top: 16px; }
  .field-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .field label { font-size: 14px; font-weight: 700; color: var(--ink2); }
  .field-top a { font-size: 14px; font-weight: 600; color: var(--ink2); }
  .field-top a:hover { color: var(--blue); }
  .input-wrap { position: relative; }
  .field input { width: 100%; height: 50px; padding: 0 16px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); font: inherit; font-size: 16px; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
  .field input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(47,98,168,.12); }
  .field input.has-eye { padding-right: 48px; }
  .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border: 0; background: none; color: #94a3b8; display: grid; place-items: center; border-radius: 8px; }
  .eye:hover { color: var(--ink2); }
  .eye svg { width: 20px; height: 20px; }

  .btn-primary { width: 100%; height: 54px; margin-top: 22px; border: 0; border-radius: var(--r); background: var(--blue); color: #fff; font-weight: 700; font-size: 18px; box-shadow: 0 10px 24px -10px rgba(47,98,168,.6); transition: background .15s, transform .05s; }
  .btn-primary:hover { background: var(--blue-h); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { opacity: .7; cursor: default; }

  .legal { font-size: 13px; color: var(--muted); text-align: center; margin-top: 12px; line-height: 1.5; }
  .legal a { color: var(--ink2); text-decoration: underline; text-underline-offset: 2px; }

  .msg { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; text-align: center; }
  .msg.error { display: block; background: #fef2f2; color: var(--err); border: 1px solid #fecaca; }
  .msg.success { display: block; background: #f0fdf4; color: var(--ok); border: 1px solid #bbf7d0; }

  .peek { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; padding: 14px 16px; background: var(--soft); border-radius: 14px; font-size: 15.5px; color: var(--ink2); }
  .peek svg { width: 22px; height: 22px; stroke: var(--blue); flex: none; }
  .peek a { margin-left: auto; background: var(--navy); color: #fff; font-weight: 700; font-size: 15px; padding: 9px 14px; border-radius: 9px; }
  .peek a:hover { background: #0f1b2b; }

  .switch { text-align: center; margin-top: 22px; font-size: 15.5px; color: var(--muted); }
  .switch a { color: var(--blue); font-weight: 600; }
  .switch a:hover { text-decoration: underline; }

  /* ── Handy / Tablet ── */
  @media (max-width: 900px) {
    .auth { grid-template-columns: 1fr; }
    .side { min-height: 260px; padding: 76px 24px 28px; }
    .side-photo { object-position: 62% 50%; }
    .side::after { background: linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.45) 55%, rgba(0,0,0,.35) 100%); }
    .side-logo { top: 22px; left: 24px; }
    .eyebrow { margin-bottom: 10px; font-size: 12px; }
    .side h2 { font-size: 30px; margin-bottom: 0; }
    .checks { display: none; }
    .main { padding: 30px 20px 36px; align-items: flex-start; }
    .box h1 { font-size: 28px; }
  }
  @media (max-width: 380px) { .social { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="auth">

  <!-- ══ Links: Kettensäge + Vorteile ══ -->
  <aside class="side">
    <img class="side-photo" src="/kettensaege.webp" alt="" width="1400" height="1038" fetchpriority="high" />
    <a class="side-logo" href="/"><b>1A</b> Motor</a>
    <div class="eyebrow">1A Motor 2027</div>
    <h2>Willkommen zurück.</h2>
    <ul class="checks">
      <li><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>Nachrichten und Angebote an einem Ort</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>Suchalarme für deine Motorcodes</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>Inserate und Bestand verwalten</li>
    </ul>
  </aside>

  <!-- ══ Rechts: Formular ══ -->
  <main class="main">
    <div class="box">
      <h1>Anmelden</h1>

      <div class="social one" id="social">
        <button type="button" class="btn-social" id="google-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.7 3.9 5.9 3.9 9.5s-1.3 6.8-3.9 9.5c-2.6-2.7-3.9-5.9-3.9-9.5S9.4 5.2 12 2.5z"/></svg>
          Mit Google
        </button>
        <button type="button" class="btn-social" id="apple-btn" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="16.5" r="3.5"/><path d="M10 14 19 5M16 8l2.5 2.5M18.5 5.5 21 8"/></svg>
          Mit Apple
        </button>
      </div>

      <div class="divider">oder</div>

      <form id="login-form" novalidate>
        <div class="field">
          <div class="field-top"><label for="login-email">E-Mail</label></div>
          <input type="email" id="login-email" autocomplete="email" required />
        </div>

        <div class="field">
          <div class="field-top">
            <label for="login-password">Passwort</label>
            <a href="#" id="magic-link">Login-Link per E-Mail</a>
          </div>
          <div class="input-wrap">
            <input type="password" id="login-password" class="has-eye" autocomplete="current-password" required />
            <button type="button" class="eye" data-eye="login-password" aria-label="Passwort anzeigen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="login-btn">Anmelden</button>
        <div class="msg" id="login-msg" role="status"></div>
      </form>

      <div class="peek">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4M5.3 5.3l2.8 2.8M15.9 15.9l2.8 2.8M5.3 18.7l2.8-2.8M15.9 8.1l2.8-2.8"/></svg>
        Nur mal reinschauen?
        <a href="/suche">Ohne Konto stöbern</a>
      </div>

      <p class="switch">Neu hier? <a href="/registrieren">Konto erstellen</a></p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const form = $("login-form"), btn = $("login-btn"), msg = $("login-msg");
  const emailEl = $("login-email"), passEl = $("login-password");

  function showMsg(text, type) { msg.className = "msg " + type; msg.textContent = text; }

  // ── Passwort anzeigen/verbergen
  document.querySelectorAll("[data-eye]").forEach((b) => b.addEventListener("click", () => {
    const inp = $(b.dataset.eye);
    const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    b.style.color = show ? "var(--blue)" : "";
  }));

  if (typeof supabaseClient === "undefined") return;

  // ── Bereits eingeloggt? → Dashboard
  try {
    const { data } = await supabaseClient.auth.getSession();
    if (data?.session?.user) { location.href = "/dashboard"; return; }
  } catch (e) {}

  // ── Social Login: Apple nur zeigen, wenn in Supabase aktiviert
  try {
    const r = await fetch(SUPABASE_URL + "/auth/v1/settings", { headers: { apikey: SUPABASE_KEY } });
    const ext = (await r.json()).external || {};
    if (ext.apple) { $("apple-btn").hidden = false; $("social").classList.remove("one"); }
    if (ext.google === false) $("google-btn").hidden = true;
  } catch (e) {}

  async function oauth(provider) {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider, options: { redirectTo: location.origin + "/dashboard.html" }
    });
    if (error) showMsg("Anmeldung fehlgeschlagen: " + error.message, "error");
  }
  $("google-btn").addEventListener("click", () => oauth("google"));
  $("apple-btn").addEventListener("click", () => oauth("apple"));

  // ── Login-Link per E-Mail (ohne Passwort)
  $("magic-link").addEventListener("click", async (e) => {
    e.preventDefault();
    const email = emailEl.value.trim();
    if (!email) { showMsg("Gib oben deine E-Mail ein – dann schicken wir dir einen Login-Link.", "error"); emailEl.focus(); return; }
    showMsg("Link wird gesendet …", "success");
    const { error } = await supabaseClient.auth.signInWithOtp({
      email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + "/dashboard.html" }
    });
    if (error && /rate limit|seconds/i.test(error.message)) {
      showMsg("Bitte kurz warten und es dann nochmal versuchen.", "error"); return;
    }
    if (error && !/signups not allowed|not found/i.test(error.message)) {
      showMsg("Fehler: " + error.message, "error"); return;
    }
    showMsg("✅ Falls ein Konto existiert, ist der Login-Link jetzt unterwegs. Prüfe deine E-Mails.", "success");
  });

  // ── Login mit Passwort
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = emailEl.value.trim(), password = passEl.value;
    if (!email || !password) { showMsg("Bitte E-Mail und Passwort eingeben.", "error"); return; }

    btn.disabled = true; btn.textContent = "Anmelden …";
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      let text = "Login fehlgeschlagen.";
      if (error.message.includes("Invalid login credentials")) text = "E-Mail oder Passwort falsch.";
      else if (error.message.includes("Email not confirmed")) text = "E-Mail noch nicht bestätigt. Bitte prüfe deinen Posteingang.";
      showMsg(text, "error");
      btn.disabled = false; btn.textContent = "Anmelden";
      return;
    }
    showMsg("✅ Login erfolgreich! Du wirst weitergeleitet …", "success");
    setTimeout(() => { location.href = "/dashboard"; }, 800);
  });
})();
</script>
<script src="/mobile.js"></script>
