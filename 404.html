<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seite nicht gefunden – 1A Motor</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root { --dark:#0d1b2a; --navy:#1b2d42; --blue:#1a5fa8; --blue2:#2176c7; --muted:#7a93ae; --border:#e0e9f2; --bg:#f4f7fb; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', Arial, sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    header { background: var(--dark); padding: 16px 24px; }
    .logo { display: inline-flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; font-size: 20px; }
    .logo b { background: var(--blue); border-radius: 8px; padding: 4px 9px; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 20px; }
    .box { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 44px 36px; max-width: 520px; width: 100%; text-align: center; box-shadow: 0 8px 40px rgba(13,27,42,.08); }
    .code { font-size: 64px; font-weight: 800; color: var(--blue); line-height: 1; }
    h1 { font-size: 24px; margin: 14px 0 10px; }
    p { color: var(--muted); line-height: 1.55; }
    .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
    .btn { padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 15px; border: 1px solid var(--border); }
    .btn.primary { background: linear-gradient(135deg, var(--blue), var(--blue2)); color: #fff; border: 0; }
    footer { text-align: center; padding: 18px; font-size: 13px; color: var(--muted); }
    footer a { margin: 0 8px; }
  </style>
</head>
<body>
  <header><a class="logo" href="/"><b>1A</b> Motor</a></header>
  <main>
    <div class="box">
      <div class="code">404</div>
      <h1>Diese Seite gibt es nicht (mehr)</h1>
      <p>Vielleicht wurde die Anzeige verkauft oder der Link ist veraltet. Über die Suche findest du passende Motoren.</p>
      <div class="btns">
        <a class="btn primary" href="/suche">Motoren durchsuchen</a>
        <a class="btn" href="/motoren-lexikon">Motorenlexikon</a>
        <a class="btn" href="/">Zur Startseite</a>
      </div>
    </div>
  </main>
  <footer><a href="/impressum">Impressum</a><a href="/datenschutz">Datenschutz</a><a href="/agb">AGB</a></footer>
</body>
</html>
